aid: walrus-protocol
name: Walrus Protocol
description: >-
  Walrus is a decentralized blob storage protocol built on Sui by Mysten Labs, the team
  behind the Sui blockchain. It provides robust, cost-effective storage for large binary
  objects with high-availability guarantees using Red Stuff erasure coding across a
  permissionless set of storage nodes. Data is content-addressed, immutable, verifiable
  without trusting any single provider, and portable across apps, providers, and AI agents.
  Developers interact through the `walrus` client CLI, a TypeScript SDK, and an HTTP API
  served by publisher (write) and aggregator (read) daemons, with storage paid in WAL and
  on-chain coordination in SUI. Walrus also powers Walrus Sites (decentralized web hosting)
  and Walrus Memory (a portable memory layer for AI agents). Backed by Electric Capital.
